igdb_proxy.games:
  path: '/igdb/feed/games'
  defaults:
    _controller: '\Drupal\igdb_proxy\Controller\IgdbProxyController::games'
    _title: 'IGDB Games Feed'
  requirements:
    _access: 'TRUE'

igdb_proxy.games_delta:
  path: '/igdb/feed/games-delta'
  defaults:
    _controller: '\Drupal\igdb_proxy\Controller\IgdbProxyController::gamesDelta'
    _title: 'IGDB Games Delta Feed'
  requirements:
    _access: 'TRUE'
