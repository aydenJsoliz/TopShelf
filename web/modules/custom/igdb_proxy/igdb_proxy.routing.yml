igdb_proxy.games:
  path: '/igdb/feed/games'
  defaults:
    _controller: '\Drupal\igdb_proxy\Controller\IgdbProxyController::games'
    _title: 'IGDB Games Feed'
  requirements:
    _access: 'TRUE'

igdb_proxy.genres:
  path: '/igdb/feed/genres'
  defaults:
    _controller: '\Drupal\igdb_proxy\Controller\IgdbProxyController::genres'
    _title: 'IGDB Genres Feed'
  requirements:
    _access: 'TRUE'

igdb_proxy.platforms:
  path: '/igdb/feed/platforms'
  defaults:
    _controller: '\Drupal\igdb_proxy\Controller\IgdbProxyController::platforms'
    _title: 'IGDB Platforms Feed'
  requirements:
    _access: 'TRUE'